version: "3.9"

services:
  neural-jsdf:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: neural-jsdf

    network_mode: host

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    volumes:
      - ../:/root/Neural-JSDF
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /root/Neural-JSDF

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    stdin_open: true
    tty: true
